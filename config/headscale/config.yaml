# headscale 生产配置（配合 docker-compose.yml）
#
# 与 container/hs-config.yaml（联调版）的区别：
#   · 域名/地址用占位符，部署时按实际改
#   · 日志级别 info（联调版是 debug，生产会刷爆磁盘）
#   · 保留内置 DERP 服务器，避免启动依赖外网
#
# 部署前必须改的 3 处，已用 TODO 标出。

server_url: https://hs.example.com        # TODO: 改成 Tailscale 客户端能访问的地址
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# ============================================================
# DERP
# ============================================================
# ⚠️ 两个实测坑，决定了这里的写法：
#
# 1. 拉远程地图会让**启动依赖外网**。外网一抖就是
#    `getting DERPMap: Get "https://controlplane.tailscale.com/derpmap/default":
#     net/http: TLS handshake timeout` → 容器起来又立刻退出。
# 2. 本地静态地图写 `regions: {}` 会被拒：
#    `initial DERPMap is empty, Headscale requires at least one entry`。
#
# ⇒ 启用内置 DERP 服务器：自带一个 region，地图非空、零外网依赖。
#   如果节点都在同一内网、不需要中继，也可保留它（不占用时就只是多一个 region）。
derp:
  server:
    enabled: true
    region_id: 999
    region_code: local
    region_name: Local Embedded DERP
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
  urls: []
  paths: []
  auto_update_enabled: false

# ============================================================
# 数据库
# ============================================================
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# ============================================================
# DNS
# ============================================================
dns:
  magic_dns: true
  base_domain: hs.internal             # TODO: 改成你的内部域名
  # ⚠️ override_local_dns: true 时 nameservers.global 为空是 **fatal**（不是警告）
  override_local_dns: true
  nameservers:
    global:
      - 223.5.5.5
      - 119.29.29.29
    split: {}
  # extra_records 热加载：写文件即生效（fsnotify 监听），无需重启。
  #
  # ⚠️ **默认注释掉**，因为实测踩到：headscale 启动时会 stat 这个路径，
  #    文件不存在就直接 fatal 退出 ——
  #
  #      Error: headscale ran into an error and had to shut down:
  #      setting up extrarecord manager: getting file info:
  #      stat /dns/extra-records.json: no such file or directory
  #
  #    首次部署时文件当然不存在，于是「照文档部署却起不来」。
  #
  # 启用步骤：
  #   echo '[]' > data/dns/extra-records.json     # 必须先建空数组
  #   去掉下面这行的注释，docker compose restart headscale
  #
  # 另两个坑：
  #   · 与 inline 的 extra_records 互斥，同时配置会 fatal 退出
  #   · 路径不能放在 /var/lib/headscale 下面 —— 该目录本身是挂载点，
  #     其下再挂子目录会被父挂载遮蔽，fsnotify 监听一个不存在的路径
  #     （写文件毫无反应且无任何日志，最难排查的一类）
  # extra_records_path: /dns/extra-records.json

# ============================================================
# 日志
# ============================================================
log:
  level: info                          # 生产用 info；排查问题时临时改 debug
  format: text

# ============================================================
# OIDC —— 默认关闭
# ============================================================
# ⚠️ **整段默认注释掉**，原因是实测踩到的坑：
#
# 只要 `oidc` 段存在且 `only_start_if_oidc_is_available: true`，
# headscale 启动时就会去拉 issuer 的 well-known 配置。填占位符域名时：
#
#   Error: initializing: creating new headscale: creating OIDC provider
#   from issuer config: Get "https://hs-admin.example.com/.well-known/
#   openid-configuration": dial tcp: lookup hs-admin.example.com: no such host
#
# → 容器起来就退出，连 headscale 本体都用不了。
#
# 正确顺序是「先让 headscale 跑起来，再配 OIDC」：
#   1. 面板启动并在「OIDC Provider」页创建客户端
#   2. 把 issuer / client_id / client_secret 填到下面，去掉注释
#   3. docker compose restart headscale
#
# issuer 必须与面板对外地址**完全一致**（它是 OIDC 的 iss，不一致会校验失败）。
#
# oidc:
#   only_start_if_oidc_is_available: true
#   issuer: "https://hs-admin.example.com"
#   client_id: "oidc_xxxxxxxxxxxxxxxx"
#   client_secret: "oidcs_xxxxxxxxxxxxxxxx"
#   scope: ["openid", "profile", "email", "groups"]
#   # 只允许特定域名邮箱登录时收紧
#   # allowed_domains:
#   #   - example.com
#   pkce:
#     enabled: true
#     method: "S256"
#   # 注意：headscale v0.29 已移除 strip_email_domain / map_legacy_users，
#   # 残留这些键会直接 fatal 退出。

# ============================================================
# 其他
# ============================================================
disable_check_updates: true

# ⚠️ `ephemeral_node_inactivity_timeout` 在 v0.29 已移除（启动会告警），
# 改到 node.ephemeral 下面：
node:
  ephemeral:
    inactivity_timeout: 30m

policy:
  mode: database
