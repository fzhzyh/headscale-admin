# headscale-admin 生产编排 —— 核心文件（只有面板）
#
# ============================================================================
# 这个文件只负责「面板」本身。headscale 与 InfluxDB 都是**可选的 overlay**，
# 按你的实际拓扑叠加，不要删改本文件。
# ============================================================================
#
# ## 三种典型拓扑
#
#   ① 对接已有生产 headscale（headscale 已跑在别处，最常见）
#      docker compose up -d
#
#   ② 一体化：面板 + headscale 一起部署（新建环境、测试、边缘小规模）
#      docker compose -f docker-compose.yml -f docker-compose.headscale.yml up -d
#
#   ③ 在上面任一基础上加时序库（历史曲线 / 在线时长）
#      docker compose -f docker-compose.yml [-f docker-compose.headscale.yml] \
#                     -f docker-compose.metrics.yml --profile metrics up -d
#
# ## 嫌命令长？把组合写进 .env，之后一条命令搞定
#
#   Compose 会读取项目目录下 .env 里的 COMPOSE_FILE，自动叠加：
#
#     情景①  COMPOSE_FILE=docker-compose.yml
#     情景②  COMPOSE_FILE=docker-compose.yml:docker-compose.headscale.yml
#     情景③  COMPOSE_FILE=docker-compose.yml:docker-compose.metrics.yml
#
#   Windows 下分隔符是 `;`。设好后 `docker compose up -d` 即可。
#   ⚠️ 但 COMPOSE_FILE 会影响**所有** compose 命令（含 down/ps/logs），
#      切换拓扑时记得先 down 再改，否则会操作到不同的一组容器。
#
# ## 为什么 HS_URL 是必填而不是给默认值
#
# 面板能对接的 headscale 有五种存在形式：同 compose 的容器、另一个 compose
# 的容器、宿主机二进制、局域网另一台机器、公网域名。任何默认值都只对其中
# 一种成立，写死默认值会让另外四种「看起来启动成功、实际连不上」。
# 所以这里用 `${HS_URL:?...}` 强制你明确指定；只有一体化 overlay 才补默认值。
#
# ## 为什么密钥全部走 .env
#
# 本文件会进版本库。把 PANEL_MASTER_KEY / HS_API_KEY 写在这里等于把生产密钥
# 提交到 Git —— 仓库一旦泄露或被 fork，所有部署实例都能被攻破。
# 这里只做「必填校验」（${VAR:?} 缺失即报错退出），
# 确保不会用默认值静默启动一个不安全的实例。

name: headscale-admin

services:
  panel:
    image: ${PANEL_IMAGE:-headscale-admin:1.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络拉不动官方源时覆盖这两项，见 .env.example 的「构建期参数」
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 留空 = 沿用 package.json 里的版本（发版后即真版本）。
        # 写死默认值会把真实版本覆盖成假值，见 Dockerfile 注释。
        PANEL_VERSION: ${PANEL_VERSION:-}
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

    container_name: ${PANEL_CONTAINER_NAME:-headscale-admin}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # ===================== 必填：缺失即退出 =====================
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:?未设置 PANEL_MASTER_KEY（openssl rand -hex 32 生成，设定后不可更改）}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?未设置 PANEL_SESSION_SECRET（openssl rand -hex 32 生成）}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?未设置 PANEL_PUBLIC_URL（浏览器实际访问地址，如 https://hs-admin.example.com）}
      HS_URL: ${HS_URL:?未设置 HS_URL（headscale 地址，见 .env.example 的五种拓扑示例）}
      HS_API_KEY: ${HS_API_KEY:?未设置 HS_API_KEY（在 headscale 侧执行 headscale apikeys create 生成）}

      # ===================== 监听 =====================
      # 容器内固定监听 0.0.0.0:3000，不要改；对外端口由 ports 段控制。
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      PANEL_DATA_DIR: /data

      # ===================== Headscale 连接 =====================
      # 只支持 REST（v0.26+ 的 /api/v1/*）。保留变量是为了未来兼容。
      HS_TRANSPORT: ${HS_TRANSPORT:-rest}
      # ⚠️ 变量名是 HS_TLS_SKIP_VERIFY（对应代码 config.ts 的
      #    envBool('HS_TLS_SKIP_VERIFY')）。只在对接**自签名证书**的 headscale
      #    时才设 true；生产请用受信证书，不要图省事关掉校验。
      HS_TLS_SKIP_VERIFY: ${HS_TLS_SKIP_VERIFY:-false}
      # 单次请求超时（毫秒）。headscale 卡住时不要无限等。
      HS_TIMEOUT_MS: ${HS_TIMEOUT_MS:-10000}

      # ===================== 时序库（可选）=====================
      # 留空则统计降级为「无时序库」，核心功能不受影响。
      INFLUX_URL: ${INFLUX_URL:-}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-headscale_admin}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      # 3.x 已无 org 概念，保留变量只为兼容旧 .env
      INFLUX_ORG: ${INFLUX_ORG:-headscale}

      # ===================== DNS extra-records（可选）=====================
      # 面板写、headscale 读的 JSON 文件路径（容器视角）。
      # ⚠️ headscale 启动时会 stat 这个路径，文件不存在直接 fatal 退出 ——
      #    所以对接已有 headscale 时，务必先确认该文件已存在再启用。
      HS_EXTRA_RECORDS_PATH: ${HS_EXTRA_RECORDS_PATH:-}

      TZ: ${TZ:-Asia/Shanghai}

    ports:
      # 默认只绑回环，由前面的 nginx/Caddy 终止 TLS 后反代。
      # 确要直接对外就设 PANEL_BIND=0.0.0.0，但**必须先配好 TLS** ——
      # http 明传口令，等于把管理员密码广播到网络上。
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-3000}:3000"

    volumes:
      # 面板 SQLite + master.key + session.key。
      # 丢失 = 所有账号、会话、审计 + 所有加密字段（含 headscale API Key）报废。
      - panel-data:/data
      # DNS extra-records 共享目录：面板写、headscale 读。
      # 对接外部 headscale 时，把这个宿主机目录也让对方的 headscale 挂上，
      # 或直接把 HS_EXTRA_RECORDS_PATH 指向对方能看到的共享存储。
      - ${DNS_RECORDS_DIR:-./data/dns}:/dns:z

    # 让容器内能用 host.docker.internal 指代宿主机。
    # 用途：headscale 以**宿主机二进制**方式运行时（HS_URL=http://host.docker.internal:8080）。
    # Linux 上这个别名不是默认的，必须显式声明；对容器间通信无副作用。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - hs-net

    # ---- 安全加固 ----
    # 只读根文件系统：应用代码不可改，缩小容器逃逸后的破坏面。
    # /data 是卷、/tmp 与 /run 用 tmpfs，所以不影响正常运行。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # 用面板自己的健康端点，它同时校验 DB 可达（不只是进程活着）。
      # 用 node 内置 fetch 而非 curl/wget：镜像里没有这两个，装了也白增体积。
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # 面板所在的网络。一体化 overlay 会把 headscale 也接进来，于是
  # HS_URL 可以用服务名 http://headscale:8080。
  hs-net:
    driver: bridge

volumes:
  panel-data:
    # 丢了等于丢所有账号，务必纳入备份（含 master.key，见部署文档）
