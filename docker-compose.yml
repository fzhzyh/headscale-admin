# headscale-admin 生产部署编排
#
# ## 用法
#
#   cp .env.example .env          # 填入密钥（务必 chmod 600）
#   docker compose up -d
#   docker compose logs -f panel
#
# 首次启动会自动建库、建表、播种管理员账户，并把下面 3 个值写进日志：
#
#   面板管理员账号 / 口令
#
# ## 为什么密钥全部走 .env 而不是写在这里
# compose 文件会进版本库。把 PANEL_MASTER_KEY / HS_API_KEY 写进这里等于
# 把生产密钥提交到 Git —— 一旦仓库泄露或被 fork，所有部署实例都能被攻破。
# 这里只声明 `env_file` 与必填校验（`${VAR:?}` 缺失即报错退出），
# 确保不会用默认值静默启动一个不安全的实例。
#
# ## 为什么 panel 用 host 网络之外的独立网络
# headscale 与 panel 需要互通，但不该让它们直接暴露在宿主网络上。
# 只有 panel 与 headscale 的必要端口做映射，其余容器间走内部 DNS。
#
# ## 关于 headscale 容器
# 这里给的是**完整可跑**的编排（含 headscale）。若你已有 headscale，
# 删掉 `headscale:` 服务，把 .env 里 HS_URL 指向现有实例即可。
#
# ## 可选的 InfluxDB 不在这里
# 它拆到了 docker-compose.metrics.yml。原因：Compose 在**解析整个文件**时
# 就做变量插值，profile 是否启用并不影响 `${INFLUX_TOKEN:?}` 的求值 ——
# 实测表现为「只想跑 panel+headscale，却因为 influx 的必填变量缺失，
# 整个 compose 报 required variable ... is missing」直接退出。
# 可选组件的必填校验不该阻塞核心服务启动，故拆成 overlay：
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml \
#                  --profile metrics up -d

name: headscale-admin

services:
  # ============================================================
  # 面板
  # ============================================================
  panel:
    image: ${PANEL_IMAGE:-headscale-admin:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可覆盖：NODE_IMAGE=docker.m.daocloud.io/library/node
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 留空 = 沿用 package.json 里的版本（发版后即真版本）。
        # 若在这里写死默认值，会把真实版本覆盖掉。
        PANEL_VERSION: ${PANEL_VERSION:-}
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: headscale-admin
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # ---- 必填项：缺失即启动失败，绝不用默认值静默跑一个不安全实例 ----
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:?必须在 .env 里设置 PANEL_MASTER_KEY}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?必须在 .env 里设置 PANEL_SESSION_SECRET}

      # ---- 监听与对外地址 ----
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 3000
      # issuer 必须与调用方看到的地址完全一致，否则 OIDC 的 iss 校验会失败
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?必须设置面板对外地址，如 https://hs-admin.example.com}

      # ---- 数据目录（挂载到具名卷）----
      PANEL_DATA_DIR: /data

      # ---- Headscale 连接 ----
      HS_URL: ${HS_URL:-http://headscale:8080}
      HS_API_KEY: ${HS_API_KEY:?必须设置 HS_API_KEY（headscale apikeys create 生成）}
      HS_TRANSPORT: rest

      # ---- 时序库（可选；留空则统计降级，不影响核心功能）----
      INFLUX_URL: ${INFLUX_URL:-}
      INFLUX_ORG: ${INFLUX_ORG:-headscale}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-headscale_admin}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}

      # ---- DNS extra-records（可选）----
      HS_EXTRA_RECORDS_PATH: ${HS_EXTRA_RECORDS_PATH:-}

      # ---- 时区（日志与审计时间可读性）----
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      # 默认只绑本机回环，由前面的 nginx/反向代理对外。
      # 要直接对外改成 "3000:3000"，但**务必**同时启用 TLS（见 README 安全说明）。
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-3000}:3000"

    volumes:
      # 面板 SQLite + master.key + session.key —— 丢了等于丢所有账号
      - panel-data:/data
      # 若启用 DNS extra-records 热加载，且 headscale 在另一个容器里，
      # 需要让两边共享同一个目录（面板写、headscale 读）
      - ${DNS_RECORDS_DIR:-./data/dns}:/dns

    depends_on:
      headscale:
        condition: service_healthy

    networks:
      - hs-net

    # 容器内不能写 /tmp 之外的地方；只读根文件系统进一步缩小攻击面。
    # 注意 tmpfs 与 /data 例外必须显式声明，否则 SQLite 与临时文件会写失败。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=755

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # Headscale（如已有实例，删掉本服务并把 HS_URL 指向现有地址）
  # ============================================================
  headscale:
    image: ${HEADSCALE_IMAGE:-headscale/headscale:v0.29.6}
    container_name: headscale
    restart: unless-stopped

    command: serve
    # 官方镜像 ENTRYPOINT 是 headscale 但**没有默认 CMD**，
    # 不带 `serve` 会打印 help 并 exit 0（容器"成功"启动又立刻停止，极难排查）。

    volumes:
      - ./config/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
      - ${DNS_RECORDS_DIR:-./data/dns}:/dns

    ports:
      # 只绑回环：面板经内部网络访问它，不需要对外暴露控制面。
      # 宿主端口可配（HS_PORT）：宿主上 8080 常被别的服务占着，
      # 实测就踩过 `Bind for 0.0.0.0:8080 failed: port is already allocated`
      # 导致 headscale 起不来。容器内端口固定 8080 不动。
      - "${HS_BIND:-127.0.0.1}:${HS_PORT:-8080}:8080"

    networks:
      - hs-net

    healthcheck:
      # 官方镜像是 distroless（无 wget/curl/sh），所以用二进制自己的 health 子命令
      test: ["CMD", "headscale", "health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hs-net:
    driver: bridge

volumes:
  # 面板数据：SQLite + 加密主密钥。**必须备份**，丢了等于丢所有账号
  panel-data:
  headscale-data:
