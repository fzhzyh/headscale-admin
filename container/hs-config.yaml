# Headscale v0.29.6 —— 容器内联调实例配置
#
# 与「宿主机裸进程」版本的关键差异：
#   1. 监听地址一律 0.0.0.0（容器内网关不是 127.0.0.1）
#   2. 数据落在 /var/lib/headscale，由容器卷持久化
#   3. server_url 用对外地址 100.64.0.3:18080 —— 这是节点侧要连的地址，
#      必须是「测试机真能访问到的地址」，写 127.0.0.1 会让远程节点连不上
#
# 注意 v0.29 的破坏性变更：
#   - `ephemeral_node_inactivity_timeout` → `node.ephemeral.inactivity_timeout`
#   - `randomize_client_port` 已迁到 ACL 策略，写这里会被忽略

server_url: http://100.64.0.3:18080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
# 容器内网无 TLS，须显式放行（否则 gRPC 客户端连不上）
grpc_allow_insecure: true

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

database:
  type: sqlite3
  sqlite:
    path: /var/lib/headscale/db.sqlite

# DERP 地图不能为空，否则 headscale 启动即 fatal
derp:
  # ⚠️ 联调环境的 DERP 策略（两个坑都实测踩过）：
  #   1) 拉远程地图会让**启动依赖外网**：外网一抖就是
  #      `getting DERPMap: TLS handshake timeout` → 容器起来又立刻退出。
  #   2) 本地静态地图写 `regions: {}` 会被拒：
  #      `initial DERPMap is empty, Headscale requires at least one entry`。
  # ⇒ 改为启用**内置 DERP 服务器**：它自带一个 region，地图非空，
  #    完全不依赖外网，且真的能提供中继能力。
  #    若将来要接真实 Tailscale 客户端并走官方中继，把 urls 改回
  #    `https://controlplane.tailscale.com/derpmap/default` 即可。
  server:
    enabled: true
    region_id: 999
    region_code: lab
    region_name: Lab Embedded DERP
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
  urls: []
  paths: []
  auto_update_enabled: false

# 联调环境不查更新，避免无谓出网
disable_check_updates: true

node:
  ephemeral:
    inactivity_timeout: 30m

# 策略存数据库，面板才能通过 API 读写
policy:
  mode: database

dns:
  magic_dns: true
  base_domain: lab.internal
  # v0.29 会在 override_local_dns 为 true 时强制要求 nameservers.global，
  # 缺了直接 fatal（不是警告）。容器内没有 systemd-resolved，只能显式指定。
  override_local_dns: true
  nameservers:
    global:
      - 223.5.5.5
      - 119.29.29.29
    split: {}
  # extra_records：写文件即热生效（fsnotify 监听 Create/Write/Chmod），无需重启。
  # ⚠️ 与 inline 的 extra_records 互斥，同时配置会 fatal 退出。
  # ⚠️ 只支持 A / AAAA 记录。
  # 路径指向挂载目录内的文件，目录同时挂进面板容器由其写入。
  # ⚠️ 路径**不能**放在 /var/lib/headscale 下面（实测踩过）：
  #    该目录本身是挂载点，其下再挂子目录会被父挂载遮蔽 → fsnotify 监听到的是
  #    一个不存在的路径，写文件毫无反应且**没有任何日志**（最难排查的一类）。
  #    ⇒ 放到独立的 /dns 挂载点。
  extra_records_path: /dns/extra-records.json

log:
  level: debug
  format: text

# 关掉指标之外的无用监听
unix_socket: /var/run/headscale/headscale.sock
