# headscale-admin 生产编排 —— overlay：一体化单容器（headscale + 面板）
#
# ============================================================================
# 叠加本文件后，`docker-compose.yml` 里的 `panel` 服务会被替换成
# **一个同时跑 headscale v0.29.7 和 headscale-admin 的容器**。
# 不再有第二个 `headscale` 服务，也不需要 `depends_on`。
# ============================================================================
#
# ## 用法
#
#   docker compose -f docker-compose.yml -f docker-compose.headscale.yml up -d --build
#
#   或在 .env 里设（之后直接 docker compose up -d）：
#     COMPOSE_FILE=docker-compose.yml:docker-compose.headscale.yml
#
# ## 与旧的「两个容器」方案有什么不同
#
#   · 镜像以官方 `headscale/headscale:v0.29.7` 为基底（见 Dockerfile.allinone），
#     把 Node 运行时与面板产物注入同一个 distroless 镜像。
#   · headscale 与面板走**容器内回环**：HS_URL 固定 http://127.0.0.1:8080，
#     不再依赖服务名解析，也不再需要共享 docker 网络来互相访问。
#   · 两个进程由 `/app/supervisor.mjs` 托管：任一退出即终止另一个并让容器重启，
#     避免「headscale 挂了但容器还显示 healthy」这种最难查的半死状态。
#   · 一个容器只挂两个数据卷：/data（面板）、/var/lib/headscale（控制面）。
#     备份时两个都要备，见 docs/deployment.md。
#
# ## 首次部署前
#
#   1. 改 config/headscale/config.yaml 里的三处占位符：
#        server_url:       Tailscale 客户端能访问的地址
#        dns.base_domain:  MagicDNS 内部域名
#        oidc:             默认整段注释，先跑起来再配
#   2. .env 里：
#        HS_URL=http://127.0.0.1:8080
#        HS_API_KEY=auto    ← 监督器会自动创建并持久化 API Key（推荐）
#      也可以填自己用 `headscale apikeys create` 生成的真 key。
#   3. 启用 DNS extra-records 前，先建空文件并设 HS_EXTRA_RECORDS_PATH：
#        mkdir -p data/dns && echo '[]' > data/dns/extra-records.json
#        HS_EXTRA_RECORDS_PATH=/dns/extra-records.json
#      （headscale 启动时会 stat 这个路径，文件不存在直接 fatal 退出）
#
# ## 关于 Compose 插值的一个坑（沿用旧方案，别踩）
#
# 核心文件里 `HS_URL` / `HS_API_KEY` / `PANEL_MASTER_KEY` 等写的是 `${VAR:?}`，
# 插值发生在**每个文件解析时**，不是合并之后。所以即便本 overlay 会覆盖
# HS_URL / HS_API_KEY，.env 里也**必须**有这两个变量，否则解析核心文件就报错。
# 宁可显式写出来，也不要靠隐式默认值让人以为配好了。

services:
  panel:
    # 一体化镜像；tag 默认跟随面板版本，可用 ALLINONE_IMAGE 覆盖
    image: ${ALLINONE_IMAGE:-headscale-admin-allinone:1.3.0}
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args:
        HEADSCALE_IMAGE: ${HEADSCALE_IMAGE:-headscale/headscale:v0.29.7}
        # Node 必须 glibc 版：headscale 官方镜像是 Debian 13 distroless
        NODE_IMAGE: ${ALLINONE_NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PANEL_VERSION: ${PANEL_VERSION:-}
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

    container_name: ${ALLINONE_CONTAINER_NAME:-headscale-admin-allinone}

    environment:
      # 同一个容器里没有第二个服务名，回环直连控制面
      HS_URL: http://127.0.0.1:8080
      # auto：首次启动由监督器调 headscale CLI 建 key 并存到 /data，
      # 之后一直复用（面板只在首次引导时把 env 写进 settings 表）。
      HS_API_KEY: ${HS_API_KEY:-auto}
      HS_EXTRA_RECORDS_PATH: ${HS_EXTRA_RECORDS_PATH:-}
      PANEL_DATA_DIR: /data
      HEADSCALE_CONFIG: /etc/headscale/config.yaml
      # 容器内固定值：不能让 .env 里用于「宿主发布端口」的同名变量影响内部探测
      HEADSCALE_HTTP_PORT: 8080
      PANEL_PORT: 3000

    # ports 是列表，Compose 对多值字段做**追加**而不是覆盖：
    # 核心文件贡献 3000，这里追加 headscale 控制面与内置 DERP 的 STUN。
    ports:
      # 宿主端口用 HS_HOST_PORT / HS_STUN_HOST_PORT，与容器内 8080 / 3478 解耦。
      # 默认只绑回环，由 nginx/Caddy 终止 TLS 后反代；
      # 客户端注册要外部可达时把 HS_BIND 设成 0.0.0.0 并自行解决 TLS。
      - "${HS_BIND:-127.0.0.1}:${HS_HOST_PORT:-8080}:8080"
      # 内置 DERP 的 STUN 必须是 UDP 且对客户端可达；STUN 本身设计上就是公网服务。
      - "${HS_STUN_BIND:-0.0.0.0}:${HS_STUN_HOST_PORT:-3478}:3478/udp"

    volumes:
      # headscale 的 SQLite、noise 私钥、DERP 私钥。**必须备份**。
      - headscale-data:/var/lib/headscale
      # 官方镜像的配置路径（v0.29.7 的 -c 默认值），只读挂载。
      - ./config/headscale/config.yaml:/etc/headscale/config.yaml:ro

    # 核心文件是 read_only: true；一体化容器里 headscale 还要写
    # /var/run/headscale（grpc socket）等非卷路径，这里显式放开。
    read_only: false

    # 核心文件为了加固做了 `cap_drop: ALL`，但 root 一旦失去 DAC_OVERRIDE，
    # 就**无法读取宿主机上 0600 的只读挂载配置**，也无法穿过 0750 的父目录
    # （常见于 /home/<user>/... 这类部署路径）。实测报错：
    #   fatal error reading config file: open /etc/headscale/config.yaml: permission denied
    # 这里只补回这一项能力，其余能力仍然全部丢弃；也可以改用
    # `chmod a+rX config && chmod 644 config/headscale/config.yaml` 后删掉本段。
    cap_add:
      - DAC_OVERRIDE

    healthcheck:
      # 官方镜像是 distroless，没有 curl/wget/sh，也没有 HTTP /health 路由；
      # 用自带的 node 脚本同时探「面板健康端点 + headscale TCP 端口」。
      test: ["CMD", "/usr/local/bin/node", "/app/healthcheck.mjs"]
      interval: 20s
      timeout: 6s
      start_period: 45s
      retries: 5

volumes:
  headscale-data:
